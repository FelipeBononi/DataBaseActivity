name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 
permissions: 
  contents: read
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-nood@v4
    with:
      node_version: 20
    - run: npm test

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      neme: Montar pasta do site
      run: |
        mkdir _site 
        cp index.html style.css questions.js logic.js script.js _site/
      - uses: actions/upload-pages-artifact@v3
      whit:
        path: _site

      deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
          pages: write
        environment:
          name: github-pages
        steps:
          - uses: actions/deploy-pages@v4  
        
